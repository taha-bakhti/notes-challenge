#:schema https://supabase.com/schemas/config/v1.json
# Supabase CLI 3.2 configuration, reduced from `supabase init` defaults.
# Local settings only: this file does not change a hosted project's Auth settings.
project_id = "supabase-notes-rehearsal"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/confirm"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enabled = true
# Convenience for disposable rehearsal accounts. Enable to exercise confirmation.
enable_confirmations = false
double_confirm_changes = true
max_frequency = "1s"

[auth.email.template.confirmation]
subject = "Confirm your Private Notes account"
content_path = "./supabase/templates/confirmation.html"

[analytics]
enabled = false
